<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>MacKit · macOS 自用工具箱</title>
  <!-- 仅本地样式，零外部资源（无 CDN / 无外链字体 / 无外链图标） -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== 外壳：顶栏 + 侧边栏 + 主区 + 日志抽屉 ===================== -->
  <div id="shell" class="shell">

    <!-- 顶栏 -->
    <header class="topbar" id="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">
          <!-- 内联 SVG 图标：工具箱 -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="18" height="13" rx="2" />
            <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <path d="M3 12h18" />
          </svg>
        </span>
        <span class="topbar__name">MacKit</span>
        <span class="topbar__sub">macOS 自用工具箱</span>
      </div>

      <div class="topbar__right">
        <span id="serviceStatus" class="service-status" title="后端服务状态">
          <span id="serviceDot" class="service-status__dot"></span>
          <span id="serviceText" class="service-status__text">连接中…</span>
        </span>
        <button id="btnShutdown" class="btn btn--ghost" type="button" title="关闭 MacKit 后台服务">
          关闭服务
        </button>
      </div>
    </header>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav" aria-label="主导航">
        <!-- 视图导航项由 app.js 渲染（T04） -->
      </nav>

      <div class="sidebar__divider" role="separator"></div>

      <section class="history" id="historyPanel" aria-label="任务历史">
        <div class="history__head">
          <span class="history__title">任务历史</span>
          <button id="btnHistoryRefresh" class="btn btn--icon" type="button" title="刷新任务历史">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>
        <ul class="history__list" id="historyList">
          <!-- 任务历史条目由 app.js 渲染（T04） -->
        </ul>
      </section>
    </aside>

    <!-- 主区 -->
    <main class="main" id="main" tabindex="-1">
      <!-- 当前视图由 app.js 的哈希路由挂载 -->
      <div class="view-loading" id="viewLoading">正在载入…</div>
    </main>

    <!-- 日志抽屉 -->
    <footer class="logdrawer logdrawer--collapsed" id="logDrawer">
      <div class="logdrawer__bar" id="logDrawerBar">
        <button id="btnLogToggle" class="logdrawer__toggle" type="button" aria-expanded="false"
                aria-controls="logBody" title="展开 / 折叠日志抽屉">
          <svg class="logdrawer__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 15l6-6 6 6" />
          </svg>
          <span>日志</span>
        </button>

        <span id="logTaskLabel" class="logdrawer__task">暂无任务</span>

        <div class="logdrawer__actions">
          <label class="logdrawer__check">
            <input type="checkbox" id="chkAutoScroll" checked />
            <span>自动滚动</span>
          </label>
          <button id="btnLogClear" class="btn btn--ghost btn--sm" type="button">清屏</button>
          <button id="btnLogCopy" class="btn btn--ghost btn--sm" type="button">复制全部</button>
          <button id="btnLogOpen" class="btn btn--ghost btn--sm" type="button">打开日志文件</button>
        </div>
      </div>

      <div class="logdrawer__body" id="logBody">
        <ol class="loglist" id="logList">
          <li class="loglist__empty" id="logEmpty">暂无日志 · 任务开始后日志会实时显示在这里</li>
        </ol>
      </div>
    </footer>
  </div>

  <!-- 服务已关闭遮罩（默认隐藏，由 app.js 在收到关闭结果后显示） -->
  <div class="shutdown-veil" id="shutdownVeil" hidden>
    <div class="shutdown-veil__card">
      <div class="shutdown-veil__dot"></div>
      <h1 class="shutdown-veil__title">服务已关闭</h1>
      <p class="shutdown-veil__text">MacKit 后台服务已停止，可以关闭此标签页。</p>
      <p class="shutdown-veil__text">需要时再次双击 <code>MacKit.command</code> 即可重新打开。</p>
    </div>
  </div>

  <!-- 全局提示 / 弹窗挂载点（由 app.js 使用） -->
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <div id="modalHost" class="modal-host" hidden></div>

  <noscript>
    <div class="noscript">MacKit 需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
